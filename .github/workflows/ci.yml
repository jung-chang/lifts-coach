name: Check and deploy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: lifts-coach-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:public
      - run: pnpm test
      - run: pnpm build
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Check deployment configuration
        id: configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN || vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD || vars.ACCESS_AUD }}
        run: node scripts/check-deployment.mjs
      - name: Mask deployment metadata
        if: steps.configuration.outputs.ready == 'true'
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN || vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD || vars.ACCESS_AUD }}
        run: |
          node --input-type=module <<'NODE'
          for (const name of ['D1_DATABASE_ID', 'ACCESS_TEAM_DOMAIN', 'ACCESS_AUD']) {
            const value = process.env[name];
            if (!value) continue;
            for (const candidate of new Set([value, value.trim()])) {
              if (!candidate) continue;
              const escaped = candidate.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
              process.stdout.write(`::add-mask::${escaped}\n`);
            }
          }
          NODE
      - uses: pnpm/action-setup@v5
        if: steps.configuration.outputs.ready == 'true'
        with:
          version: 10.33.0
      - uses: actions/setup-node@v5
        if: steps.configuration.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.configuration.outputs.ready == 'true'
      - run: pnpm build
        if: steps.configuration.outputs.ready == 'true'
      - name: Migrate and deploy
        if: steps.configuration.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN || vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD || vars.ACCESS_AUD }}
          COACH_OWNER_EMAIL: ${{ secrets.COACH_OWNER_EMAIL }}
        run: |
          pnpm cloudflare:configure
          if [ -n "$COACH_OWNER_EMAIL" ]; then
            printf '%s' "$COACH_OWNER_EMAIL" | pnpm exec wrangler secret put COACH_OWNER_EMAIL --config wrangler.deploy.json
          fi
          pnpm exec wrangler d1 migrations apply lifts-coach --remote --config wrangler.deploy.json
          pnpm exec wrangler deploy --config wrangler.deploy.json
